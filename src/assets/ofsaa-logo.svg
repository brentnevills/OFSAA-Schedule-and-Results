<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1020" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shieldShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#05101d" flood-opacity="0.35" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Linear Gradients for Lettering -->
    <linearGradient id="metalLetterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="51%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="navyShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b2341" />
      <stop offset="100%" stop-color="#07172b" />
    </linearGradient>
  </defs>

  <!-- Group with subtle drop shadow -->
  <g filter="url(#shieldShadow)">
    <!-- 1. OUTER SHIELD CONTOUR (Light Columbia Blue Outermost Trim) -->
    <path 
      d="M 450,15 
         C 460,15 470,16 480,18
         L 620,18
         C 635,18 645,28 648,42
         L 745,42
         C 760,42 770,54 770,70
         L 770,180
         L 755,180
         L 755,360
         L 880,360
         C 892,360 900,370 898,382
         L 875,580
         C 872,592 862,600 850,600
         L 750,600
         L 750,650
         C 750,660 745,670 738,678
         L 465,990
         C 458,998 442,998 435,990
         L 162,678
         C 155,670 150,660 150,650
         L 150,600
         L 50,600
         C 38,600 28,592 25,580
         L 2,382
         C 0,370 8,360 20,360
         L 145,360
         L 145,180
         L 130,180
         C 130,165 140,150 155,150
         L 335,150
         C 340,100 375,30 435,18
         Z" 
      fill="#b8d3ef" 
    />

    <!-- 2. WHITE CONTOUR MATTE -->
    <path 
      d="M 450,26 
         C 458,26 466,27 474,29
         L 614,29
         C 625,29 635,37 638,48
         L 738,48
         C 748,48 756,58 756,70
         L 756,188
         L 742,188
         L 742,370
         L 868,370
         C 876,370 882,377 880,385
         L 860,570
         C 858,578 850,586 840,586
         L 738,586
         L 738,646
         C 738,653 734,661 728,668
         L 460,976
         C 455,982 445,982 440,976
         L 172,668
         C 166,661 162,653 162,646
         L 162,586
         L 60,586
         C 50,586 42,578 40,570
         L 20,385
         C 18,377 24,370 32,370
         L 158,370
         L 158,188
         L 144,188
         C 144,175 152,162 165,162
         L 338,162
         C 346,108 380,38 438,28
         Z" 
      fill="#ffffff" 
    />

    <!-- 3. MAIN NAVY SHIELD BODY -->
    <!-- Top & Body Shield -->
    <path 
      d="M 160,195 
         L 740,195 
         L 740,640 
         L 450,965 
         L 160,640 
         Z" 
      fill="url(#navyShieldGrad)" 
      stroke="#0b2341" 
      stroke-width="6" 
    />

    <!-- Upper Gold Trim Chevron in Top Shield -->
    <path 
      d="M 195,240 
         L 705,240 
         L 705,370 
         M 705,580
         L 705,620
         L 450,910 
         L 195,620 
         L 195,580" 
      fill="none" 
      stroke="#f59e0b" 
      stroke-width="14" 
      stroke-linecap="round"
      stroke-linejoin="miter"
    />

    <!-- BOTTOM SHIELD VOLLEYBALL (White stylized lines on navy) -->
    <g transform="translate(450, 780)">
      <!-- Ball dome/silhouette -->
      <ellipse cx="0" cy="0" rx="140" ry="110" fill="#07172b" />
      <path d="M -110,-20 C -70,20 -10,35 60,30 C 90,28 120,15 135,-5" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" />
      <path d="M -130,20 C -90,65 -20,80 50,75 C 80,72 110,60 125,40" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round" />
      <path d="M -70,-60 C -40,-20 -20,40 -25,90" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />
      <path d="M 20,-75 C 45,-30 55,30 45,85" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />
      <path d="M -100,55 C -60,85 0,100 65,90" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Inner Bottom Gold Chevron -->
    <path 
      d="M 215,705 
         L 450,925 
         L 685,705" 
      fill="none" 
      stroke="#f59e0b" 
      stroke-width="16" 
      stroke-linecap="square"
      stroke-linejoin="miter"
    />

    <!-- TOP: VOLLEYBALL BALL (Top Right) -->
    <g transform="translate(640, 68)">
      <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#0b2341" stroke-width="6" />
      <!-- Volleyball curved seams -->
      <path d="M -32,-32 C -10,-10 -10,10 -32,32" fill="none" stroke="#0b2341" stroke-width="5" />
      <path d="M 32,-32 C 10,-10 10,10 32,32" fill="none" stroke="#0b2341" stroke-width="5" />
      <path d="M -46,0 C -20,0 20,0 46,0" fill="none" stroke="#0b2341" stroke-width="5" />
      <path d="M 0,-46 C 0,-20 0,20 0,46" fill="none" stroke="#0b2341" stroke-width="5" />
      <path d="M -25,-38 C 0,-20 25,-38 25,-38" fill="none" stroke="#0b2341" stroke-width="4" />
      <path d="M -25,38 C 0,20 25,38 25,38" fill="none" stroke="#0b2341" stroke-width="4" />
    </g>

    <!-- TOP: VOLLEYBALL SPIKER ATHLETE FIGURE -->
    <g transform="translate(450, 140)">
      <!-- Volleyball Player Silhouette with Gold Jersey & Athletic Accents -->
      <!-- Left leg & foot jumping -->
      <path d="M -120,120 L -60,95 L -85,145 L -105,140 Z" fill="#e2e8f0" stroke="#0b2341" stroke-width="4" />
      <!-- Right leg & knee tucked in mid-air -->
      <path d="M -40,110 L 20,135 L 5,150 L -30,135 Z" fill="#cbd5e1" stroke="#0b2341" stroke-width="4" />

      <!-- Shorts (Steel grey/slate) -->
      <path d="M -80,95 L -20,95 L 15,125 L -45,130 Z" fill="#94a3b8" stroke="#0b2341" stroke-width="4" />

      <!-- Torso / Jersey (Athletic Gold) -->
      <path 
        d="M -75,95 
           L -15,95 
           L 15,20 
           L -25,25 
           L -45,35 
           Z" 
        fill="#f59e0b" 
        stroke="#0b2341" 
        stroke-width="5" 
      />
      <!-- Jersey side stripe -->
      <path d="M -45,45 L -25,95" fill="none" stroke="#0b2341" stroke-width="6" />

      <!-- Left arm (cocked back in spike prep) -->
      <path 
        d="M -45,30 
           L -90,-20 
           L -105,-10 
           L -70,35 
           Z" 
        fill="#e2e8f0" 
        stroke="#0b2341" 
        stroke-width="5" 
      />
      <!-- Left hand -->
      <path d="M -90,-20 L -95,-45 L -110,-40 L -105,-10 Z" fill="#e2e8f0" stroke="#0b2341" stroke-width="4" />

      <!-- Head / Neck -->
      <path 
        d="M -15,18 
           L 5,-15 
           C 25,-20 35,-5 25,12 
           Z" 
        fill="#e2e8f0" 
        stroke="#0b2341" 
        stroke-width="4" 
      />
      <!-- Athletic hair/profile -->
      <path d="M -8,-5 C -5,-25 20,-30 25,-18 C 15,-18 5,-8 -8,-5 Z" fill="#0b2341" />

      <!-- Right arm (extended reaching toward volleyball) -->
      <path 
        d="M 12,25 
           L 115,-30 
           L 150,-42 
           L 145,-25 
           L 30,38 
           Z" 
        fill="#e2e8f0" 
        stroke="#0b2341" 
        stroke-width="5" 
      />
      <!-- Spiking Hand -->
      <path 
        d="M 145,-40 
           L 175,-50 
           L 182,-35 
           L 150,-25 
           Z" 
        fill="#e2e8f0" 
        stroke="#0b2341" 
        stroke-width="4" 
      />
    </g>

    <!-- OFFICIAL OFSAA LOGO IN UPPER CREST -->
    <g transform="translate(450, 335)">
      <!-- OFSAA stylized Trillium flower -->
      <g transform="translate(-250, -15)">
        <path 
          d="M 0,0 
             C -25,-30 -5,-55 25,-40 
             C 5,-15 15,10 0,0 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="9" 
        />
        <path 
          d="M 0,0 
             C 25,-30 5,-55 -25,-40 
             C -5,-15 -15,10 0,0 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="9" 
        />
        <path 
          d="M -5,-35 
             C -15,-60 15,-60 5,-35 
             Z" 
          fill="#ffffff" 
        />
      </g>

      <!-- OFSAA Typography -->
      <text 
        x="-180" 
        y="5" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="82" 
        font-weight="900" 
        fill="#ffffff" 
        letter-spacing="4"
        stroke="#07172b"
        stroke-width="6"
        paint-order="stroke fill"
      >
        OFSAA
      </text>
    </g>

    <!-- ============================================== -->
    <!-- MASSIVE "VOLLEYBALL" BANNER ACROSS MIDDLE      -->
    <!-- ============================================== -->
    <!-- Dark Navy Ribbon Backdrop for Volleyball -->
    <path 
      d="M 18,370 
         L 882,370 
         L 860,580 
         L 40,580 
         Z" 
      fill="#07172b" 
      stroke="#b8d3ef" 
      stroke-width="12" 
      stroke-linejoin="round"
    />

    <!-- VOLLEYBALL TEXT (Beveled Metallic Silver/White 3D effect) -->
    <g transform="translate(450, 535)">
      <!-- Dark Drop Shadow / Stroke Base -->
      <text 
        x="0" 
        y="0" 
        text-anchor="middle" 
        font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" 
        font-size="160" 
        font-weight="900" 
        letter-spacing="-1" 
        fill="#07172b" 
        stroke="#07172b" 
        stroke-width="26" 
        stroke-linejoin="miter"
      >
        VOLLEYBALL
      </text>

      <!-- Outer Light Blue Stroke -->
      <text 
        x="0" 
        y="0" 
        text-anchor="middle" 
        font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" 
        font-size="160" 
        font-weight="900" 
        letter-spacing="-1" 
        fill="url(#metalLetterGrad)" 
        stroke="#ffffff" 
        stroke-width="14" 
        stroke-linejoin="miter"
      >
        VOLLEYBALL
      </text>

      <!-- Front Face Letters with Split Shading -->
      <text 
        x="0" 
        y="0" 
        text-anchor="middle" 
        font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" 
        font-size="160" 
        font-weight="900" 
        letter-spacing="-1" 
        fill="url(#metalLetterGrad)"
      >
        VOLLEYBALL
      </text>
    </g>

    <!-- "CHAMPIONSHIP" GOLD TEXT -->
    <g transform="translate(450, 595)">
      <text 
        x="0" 
        y="0" 
        text-anchor="middle" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="9" 
        fill="#f59e0b"
        stroke="#07172b"
        stroke-width="4"
        paint-order="stroke fill"
      >
        CHAMPIONSHIP
      </text>
    </g>

    <!-- ============================================== -->
    <!-- 20 | BOYS AAA | 26 BANNER STRIP               -->
    <!-- ============================================== -->
    <g transform="translate(450, 660)">
      <!-- White Angled Center Plate for BOYS AAA -->
      <polygon 
        points="-180,-35 180,-35 160,35 -160,35" 
        fill="#ffffff" 
        stroke="#94a3b8" 
        stroke-width="4" 
      />

      <!-- Left Gold "20" on Navy Field -->
      <text 
        x="-245" 
        y="18" 
        text-anchor="middle" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="62" 
        font-weight="900" 
        fill="#f59e0b"
        stroke="#07172b"
        stroke-width="4"
        paint-order="stroke fill"
      >
        20
      </text>

      <!-- Center Dark Navy "BOYS AAA" -->
      <text 
        x="0" 
        y="16" 
        text-anchor="middle" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="48" 
        font-weight="900" 
        letter-spacing="3" 
        fill="#0b2341"
      >
        BOYS AAA
      </text>

      <!-- Right Gold "26" on Navy Field -->
      <text 
        x="245" 
        y="18" 
        text-anchor="middle" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="62" 
        font-weight="900" 
        fill="#f59e0b"
        stroke="#07172b"
        stroke-width="4"
        paint-order="stroke fill"
      >
        26
      </text>
    </g>

    <!-- ============================================== -->
    <!-- "CHATHAM" HOST CITY AT BOTTOM OF SHIELD        -->
    <!-- ============================================== -->
    <g transform="translate(450, 735)">
      <text 
        x="0" 
        y="0" 
        text-anchor="middle" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="7" 
        fill="#ffffff"
        stroke="#07172b"
        stroke-width="6"
        paint-order="stroke fill"
      >
        CHATHAM
      </text>
    </g>
  </g>
</svg>